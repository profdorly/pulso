# Publica o Pulso: a cozinha gera a edição do dia (e, às segundas, antes dela, o catálogo de
# modelos), o site é montado a partir dela e vai para o GitHub Pages; por fim, confere-se que o
# site no ar mostra a edição.
#
#   cozinha → site → deploy → conferência
#
# A cozinha é um arquivo SQLite num bucket R2 (backend/src/kitchen). Ela é baixada, roda e
# devolvida com escrita condicional: uma execução que perde a corrida falha em vez de apagar a
# outra, e uma que falha não muda nada.
#
# Uma corrida por dia, num dia normal. O Worker (infra/disparador) dispara às 07:32, 09:05 e 17:15,
# mas antes olha o site no ar e só dispara se a capa ainda não mostra a edição de hoje: a das 07:32
# faz o trabalho, e as outras são tentativas de verdade, que só rodam se a edição não saiu. O cron
# do GitHub das 17:10 é a rede final para um dia em que o Worker falhar inteiro; ele chega horas
# atrasado (por volta das 20h), o que para essa função não importa, e faz a mesma conferência
# antes de rodar a cozinha (job `precisa`).
#
# Sem fila única entre corridas. Em 29/10/2026 uma corrida ficou presa no GitHub antes do primeiro
# job e, como todas andavam numa fila (`concurrency.queue: max`), segurou as seguintes: 30/10 ficou
# sem edição. A fila protegia contra duas cozinhas gravando ao mesmo tempo, o que a escrita
# condicional no R2 já impede. Agora uma corrida presa custa só o próprio horário.
#
# Ambiente `production` (Settings → Environments), restrito ao branch main:
#   segredos  OPENAI_API_KEY, ARTIFICIAL_ANALYSIS_API_KEY, R2_ACCOUNT_ID,
#             R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY            (token de leitura e escrita)
#             R2_READ_ACCESS_KEY_ID, R2_READ_SECRET_ACCESS_KEY  (token só de leitura, para o site)
#             HEALTHCHECKS_URL, HEALTHCHECKS_MODELOS_URL        (opcionais)
#   variáveis PULSO_WEB_SEARCH (shadow | vazio), PULSO_MAX_EDITION_USD (opcionais)
#
# Nada aqui roda até a variável do repositório PULSO_PUBLICAR valer "true" (Settings → Secrets and
# variables → Actions → Variables). Um fork, ou este repositório antes da migração, fica inerte.

name: Publicar

on:
  # Quem dispara de fato é o Worker da Cloudflare (infra/disparador). Este cron é só a rede final.
  schedule:
    - cron: "10 20 * * *" # 17:10 em Brasília; na prática o GitHub o entrega por volta das 20h
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tarefa:
        description: "O que rodar"
        type: choice
        options: [site, edicao, modelos]
        default: site
      forcar:
        description: "Refazer a edição de hoje mesmo que já exista"
        type: boolean
        default: false
      iniciar:
        description: "Começar uma cozinha vazia (só na primeira corrida de um fork)"
        type: boolean
        default: false

permissions: {}

jobs:
  # Só no cron: a edição de hoje já está no ar? Sem ambiente nem segredos, então não passa pela
  # checagem do `production`, que é onde a corrida de 29/10 travou. Disparos à mão e do Worker
  # (que já conferiu) seguem direto.
  precisa:
    if: vars.PULSO_PUBLICAR == 'true' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      rodar: ${{ steps.check.outputs.rodar }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            frontend/src/lib/siteBase.ts
      - name: Conferir se a edição de hoje já está no ar
        id: check
        run: |
          edition="$(TZ=America/Sao_Paulo date +%F)-manha"
          if node scripts/site-live.mjs --edition "$edition"; then
            echo "rodar=false" >> "$GITHUB_OUTPUT"
          else
            echo "rodar=true" >> "$GITHUB_OUTPUT"
          fi

  cozinha:
    needs: precisa
    if: >-
      !cancelled() && vars.PULSO_PUBLICAR == 'true' && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'schedule' && needs.precisa.outputs.rodar == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.tarefa != 'site'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.kitchen.outputs.publish == 'true' || steps.live.outputs.stale == 'true' }}
      edition: ${{ steps.kitchen.outputs.edition }}
      catalogue: ${{ steps.kitchen.outputs.catalogue }}
    env:
      HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      # No dependency runs code at install time: scripts are skipped, then only the two packages
      # that must build a native binary are rebuilt (the list approved in package.json allowScripts).
      - run: npm ci --ignore-scripts
      - run: npm rebuild better-sqlite3 esbuild

      - name: Avisar o monitor que começou
        if: env.HEALTHCHECKS_URL != ''
        run: curl -fsS -m 10 --retry 3 -o /dev/null "$HEALTHCHECKS_URL/start" || true

      - name: Rodar a cozinha
        id: kitchen
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ARTIFICIAL_ANALYSIS_API_KEY: ${{ secrets.ARTIFICIAL_ANALYSIS_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PULSO_WEB_SEARCH: ${{ vars.PULSO_WEB_SEARCH }}
          PULSO_MAX_EDITION_USD: ${{ vars.PULSO_MAX_EDITION_USD }}
          MODELOS: ${{ inputs.tarefa == 'modelos' }}
          FORCAR: ${{ inputs.forcar == true }}
          INICIAR: ${{ inputs.iniciar == true }}
          # Tokens e US$ por etapa desta corrida, gravados mesmo quando ela falha (runReport.ts).
          PULSO_RUN_REPORT: ${{ runner.temp }}/run-report-${{ github.run_attempt }}.json
        run: |
          args=()
          if [ "$MODELOS" = "true" ]; then args+=(--catalogue); fi
          if [ "$FORCAR" = "true" ]; then args+=(--force); fi
          if [ "$INICIAR" = "true" ]; then args+=(--init); fi
          npm run kitchen -- "${args[@]}"

      # O relatório fica 90 dias como artefato, para o painel local (npm run health). Num
      # repositório público, qualquer conta logada no GitHub baixa um artefato, como já lê o log:
      # por isso ele só leva números, etapas, modelos e status, nunca texto de erro. Um arquivo
      # por tentativa, para "Re-run" não esbarrar no nome de um artefato que já existe.
      - name: Guardar o relatório da corrida
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/run-report-${{ github.run_attempt }}.json
          archive: false
          retention-days: 90
          if-no-files-found: ignore

      # Nada novo para publicar, mas o site mostra mesmo a edição que a cozinha tem? Se a corrida
      # anterior caiu entre a cozinha e o deploy, esta é a que republica.
      - name: Conferir o site no ar
        id: live
        if: steps.kitchen.outputs.publish != 'true' && steps.kitchen.outputs.edition != ''
        env:
          EDITION: ${{ steps.kitchen.outputs.edition }}
        run: node scripts/site-live.mjs --edition "$EDITION" || echo "stale=true" >> "$GITHUB_OUTPUT"

      - name: Avisar o monitor da falha
        if: failure() && env.HEALTHCHECKS_URL != ''
        run: curl -fsS -m 10 --retry 3 -o /dev/null "$HEALTHCHECKS_URL/fail" || true

  site:
    needs: cozinha
    # Sem cozinha (push na main, pedido de "site"), o site é refeito com o que já está publicado. O
    # cron que achou a edição no ar (job `precisa`) também pula a cozinha, e aí não há o que refazer.
    if: >-
      !cancelled() && vars.PULSO_PUBLICAR == 'true' && github.ref == 'refs/heads/main' &&
      ((needs.cozinha.result == 'skipped' &&
        (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.tarefa == 'site'))) ||
       (needs.cozinha.result == 'success' && needs.cozinha.outputs.publish == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      # No dependency runs code at install time: scripts are skipped, then only the two packages
      # that must build a native binary are rebuilt (the list approved in package.json allowScripts).
      - run: npm ci --ignore-scripts
      - run: npm rebuild better-sqlite3 esbuild

      # Só leitura, com um token que só lê: escreve data/editions (e data/editions/weekly).
      - name: Baixar as edições
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_READ_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_READ_SECRET_ACCESS_KEY }}
        run: npm run kitchen:export

      - run: npm run build:site
      - run: npm run verify:site
      - run: npm run budget:bundle
      - run: npm run a11y

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist-site

  # Sem `concurrency`: uma trava aqui deixaria um deploy preso segurar todos os seguintes, que é o
  # problema de 29/10 em outro lugar. Dois deploys ao mesmo tempo são raros (o Worker só dispara sem
  # edição no ar) e o pior caso é o segundo falhar, com aviso ao Healthchecks; o primeiro já publicou.
  deploy:
    needs: site
    if: ${{ !cancelled() && needs.site.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # O que o monitor recebe é o que o leitor vê: sucesso só quando o site no ar mostra a edição.
  conferencia:
    needs: [cozinha, site, deploy]
    if: ${{ always() && needs.cozinha.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      # Reativar o próprio agendamento: o GitHub desliga o de um repositório público após 60 dias
      # sem atividade, e a cozinha não faz commit.
      actions: write
    env:
      HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_URL }}
      HEALTHCHECKS_MODELOS_URL: ${{ secrets.HEALTHCHECKS_MODELOS_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            frontend/src/lib/siteBase.ts

      - name: Conferir o site no ar
        id: check
        env:
          KITCHEN: ${{ needs.cozinha.result }}
          PUBLISH: ${{ needs.cozinha.outputs.publish }}
          DEPLOY: ${{ needs.deploy.result }}
          EDITION: ${{ needs.cozinha.outputs.edition }}
        run: |
          if [ "$KITCHEN" != "success" ]; then echo "cozinha: $KITCHEN"; exit 1; fi
          if [ "$PUBLISH" = "true" ] && [ "$DEPLOY" != "success" ]; then echo "deploy: $DEPLOY"; exit 1; fi
          if [ -n "$EDITION" ]; then node scripts/site-live.mjs --edition "$EDITION" --wait 600; fi

      - name: Avisar o monitor
        if: always() && env.HEALTHCHECKS_URL != ''
        env:
          OUTCOME: ${{ steps.check.outcome }}
        run: |
          if [ "$OUTCOME" = "success" ]; then path=""; else path="/fail"; fi
          curl -fsS -m 10 --retry 3 -o /dev/null "$HEALTHCHECKS_URL$path" || true

      # Um segundo monitor, semanal, para o catálogo: uma segunda-feira sem captura não pode
      # passar despercebida porque a edição do dia saiu.
      - name: Avisar o monitor dos modelos
        if: needs.cozinha.outputs.catalogue == 'captured' && steps.check.outcome == 'success' && env.HEALTHCHECKS_MODELOS_URL != ''
        run: curl -fsS -m 10 --retry 3 -o /dev/null "$HEALTHCHECKS_MODELOS_URL" || true

      # Também nas execuções disparadas pelo Worker: são elas que garantem a atividade se o cron
      # do GitHub nunca rodar.
      - name: Manter o agendamento ativo
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/publicar.yml/enable"
